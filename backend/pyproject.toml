[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ajusta-core"
version = "0.1.0"
description = "Deterministic orchestration foundation for AJUSTA"
requires-python = ">=3.11"

dependencies = ["fastapi>=0.115,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
